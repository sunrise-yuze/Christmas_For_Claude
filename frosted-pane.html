<style>

  --ember:#e9a25b;
  --sky-top:#06080b;
  --sky-low:#0d1218;
  --wood:#0b0c0d;
  --flame-core:#fff8e6;
  --flame-root:#4660aa;
  --wick:#140e0a;

function setSound(on) {

  if (on && FX.musicBox) {

    if (!BOX.firstDone) { BOX.firstDone = true; BOX.autoT = 0.55; autoWind(1); }
    else if (BOX.tension < 0.05) { BOX.autoT = 0.35; autoWind(0.25); }

  }
  if (!on && FX.musicBox) {
    master.gain.linearRampToValueAtTime(0, t + 0.5);

    return;
  }
  if (on) {
    if (AC.state === 'suspended') AC.resume();

    evi = 0; loopT0 = t + 0.4;
    clearInterval(schedTimer); schedTimer = setInterval(schedule, 100); schedule();

    }

}

function build() {

  FRS = small ? 0.5 : 0.5;

  buildBackdrops();

  initLedges();

  beads = []; runners = []; breath = null; pointer = null; autoWipe = null;
  LA = LC = null; frostIn = 0; frostReady = false;
  maskDirty = true; linesDirty = true;
  buildMasks(REDUCED ? GROW_END + 10 : tg); maskDirty = false;

  const id = ++buildId;

}
let rT = 0, lastSize = '';
function onResize() {

// preview switches: #advent, #christmas-eve, #christmas-day
window.addEventListener('hashchange', () => {
  const before = clockOff; readHash(); if (before === clockOff) return;

  updateDateLine(); applySeasonCopy(); build(); compose(); drawFlame(0);

const TITLE0 = document.title;
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {

  } else {

    last = performance.now(); if (!raf) raf = requestAnimationFrame(loop); if (AC && soundOn) AC.resume();

setInterval(() => { updateDateLine(); applySeasonCopy(); }, 60000);
// the music box key: drag around it to wind (only forward turns count), tap for a quarter turn, Enter or M for a whole turn
{
  const keyEl = $('b-key');
  const keyAngle = e => { const r = keyEl.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2); return [Math.atan2(dy, dx), Math.hypot(dx, dy)]; };
  keyEl.addEventListener('pointerdown', e => {

    e.preventDefault(); try { keyEl.setPointerCapture(e.pointerId); } catch (_) {}
    KEY.drag = { id: e.pointerId, a: keyAngle(e)[0], moved: 0, t0: performance.now() }; keyEl.classList.add('held'); ensureSound();
  });
  keyEl.addEventListener('pointermove', e => {
    const k = KEY.drag; if (!k || e.pointerId !== k.id) return;
    const [a, r] = keyAngle(e); let d = a - k.a; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; k.a = a;
    if (r < 5) return;
    k.moved += Math.abs(d);
    if (d > 0 && windBy(d / TAU) > 0) BOX.everWound = true;
  });
  const up = e => {
    const k = KEY.drag; if (!k || e.pointerId !== k.id) return; KEY.drag = null; keyEl.classList.remove('held');
    if (e.type === 'pointerup' && k.moved < 0.3 && performance.now() - k.t0 < 500) { BOX.everWound = true; BOX.autoT = 0; autoWind(0.25); }
  };

  keyEl.addEventListener('click', e => { if (e.detail === 0) { BOX.everWound = true; BOX.autoT = 0; autoWind(1); } });
  keyEl.addEventListener('contextmenu', e => e.preventDefault());
}

lastSize = window.innerWidth + 'x' + window.innerHeight + '@' + window.devicePixelRatio;
if (FX.dateLine) $('vdate').textContent = dateText();
{ const c = seasonCopy(); if (c.hint !== HINTS[0]) { $('hint').children[0].textContent = c.hint; $('hint-live').textContent = c.hint; } applySeasonCopy(); }
